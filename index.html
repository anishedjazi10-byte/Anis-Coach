<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIS | PRO AI COACH</title>
    <style>
        body { background: #020202; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #080808; padding: 40px; border-radius: 25px; border: 1px solid #111; text-align: center; width: 380px; box-shadow: 0 20px 50px #000; }
        h1 { font-size: 3.5rem; letter-spacing: 10px; margin: 0; background: linear-gradient(#fff, #444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .tag { color: #00ff88; font-size: 0.6rem; letter-spacing: 3px; margin-bottom: 30px; text-transform: uppercase; opacity: 0.7; }
        
        .db-box { background: #000; border: 1px dashed #222; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; font-size: 0.8rem; }
        .db-title { color: #555; font-weight: bold; margin-bottom: 5px; display: block; }
        
        input { width: 100%; background: #050505; border: 1px solid #1a1a1a; padding: 12px; color: #00ff88; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 15px; background: transparent; border: 1px solid #00ff88; color: #00ff88; border-radius: 10px; cursor: pointer; font-weight: 900; transition: 0.4s; text-transform: uppercase; }
        .btn:hover { background: #00ff88; color: #000; box-shadow: 0 0 30px rgba(0,255,136,0.3); }
        
        #history { color: #888; margin-top: 20px; font-size: 0.75rem; border-top: 1px solid #111; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>ANIS</h1>
        <div class="tag">SECURE AI COACHING SYSTEM</div>

        <div class="db-box">
            <span class="db-title">LAST SAVED LOG:</span>
            <div id="savedData">No data in memory.</div>
        </div>

        <input type="text" id="userInput" placeholder="Log meal or swim laps...">
        <button class="btn" onclick="saveAndAnalyze()">SAVE & ANALYZE</button>

        <div id="history">Waiting for input...</div>
    </div>

    <script>
        // دالة لتحميل البيانات المحفوظة بمجرد فتح الموقع
        window.onload = function() {
            const lastLog = localStorage.getItem('anisLastLog');
            if (lastLog) {
                document.getElementById('savedData').innerText = lastLog;
            }
        };

        function saveAndAnalyze() {
            const input = document.getElementById('userInput').value;
            const savedBox = document.getElementById('savedData');
            const history = document.getElementById('history');

            if (!input) {
                alert("Please enter data first, Sir.");
                return;
            }

            // حفظ البيانات في ذاكرة المتصفح
            const time = new Date().toLocaleString();
            const logEntry = `${input} (Saved: ${time})`;
            localStorage.setItem('anisLastLog', logEntry);

            // تحديث الواجهة
            savedBox.innerText = logEntry;
            history.innerHTML = ">> <b>AI COACH:</b> Data encrypted and saved. Analysis: Your current routine is optimizing your 50m freestyle speed.";
            
            // مسح الخانة بعد الحفظ
            document.getElementById('userInput').value = "";
        }
    </script>
</body>
</html>
