<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIS | AI SYSTEM LOGIN</title>
    <style>
        :root { --neon: #00ff88; --bg: #020202; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .card { 
            background: rgba(8, 8, 8, 0.95); padding: 40px; border-radius: 20px; border: 1px solid #222; 
            width: 400px; text-align: center; box-shadow: 0 0 50px #000;
        }

        .user-profile { background: #000; border: 1px solid var(--neon); padding: 10px; border-radius: 10px; margin-bottom: 20px; display: none; font-size: 0.8rem; color: var(--neon); }

        h1 { font-size: 3rem; letter-spacing: 15px; margin: 0; color: #fff; text-shadow: 0 0 20px var(--neon); }
        
        .form-group { margin-top: 20px; text-align: left; }
        label { font-size: 0.7rem; color: #555; text-transform: uppercase; margin-left: 5px; }

        input { 
            width: 100%; padding: 12px; background: #050505; border: 1px solid #222; 
            color: var(--neon); border-radius: 5px; margin-bottom: 15px; box-sizing: border-box; outline: none; 
        }

        .btn { 
            width: 100%; padding: 15px; background: var(--neon); border: none; 
            color: #000; font-weight: bold; border-radius: 5px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; 
        }

        #aiStatus { font-size: 0.7rem; color: #444; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="userBadge" class="user-profile"></div>
        <h1>ANIS</h1>
        
        <div id="loginForm">
            <div class="form-group">
                <label>Identify Yourself (Email)</label>
                <input type="email" id="userEmail" placeholder="name@example.com">
                <label>Username</label>
                <input type="text" id="userName" placeholder="Your Name">
            </div>
            <button class="btn" onclick="registerUser()">Access System</button>
        </div>

        <div id="mainSystem" style="display:none;">
            <div class="form-group">
                <label>Daily Performance Log</label>
                <input type="text" id="activityInput" placeholder="Ex: 50m Butterfly - 28s">
            </div>
            <button class="btn" onclick="saveActivity()">Update Core</button>
            <button style="margin-top:10px; background:transparent; color:#f44; border:1px solid #f44" class="btn" onclick="logout()">Logout</button>
        </div>

        <div id="aiStatus">SYSTEM STATUS: READY</div>
    </div>

    <script>
        // التحقق من وجود مستخدم مسجل عند فتح الموقع
        window.onload = function() {
            const savedEmail = localStorage.getItem('anisUserEmail');
            const savedName = localStorage.getItem('anisUserName');
            if (savedEmail) {
                showDashboard(savedName, savedEmail);
            }
        };

        function registerUser() {
            const email = document.getElementById('userEmail').value;
            const name = document.getElementById('userName').value;

            if (!email || !name) {
                alert("Sir, identification requires both Email and Name.");
                return;
            }

            // حفظ بيانات المستخدم
            localStorage.setItem('anisUserEmail', email);
            localStorage.setItem('anisUserName', name);
            
            showDashboard(name, email);
        }

        function showDashboard(name, email) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('mainSystem').style.display = 'block';
            
            const badge = document.getElementById('userBadge');
            badge.style.display = 'block';
            badge.innerText = `ACTIVE USER: ${name.toUpperCase()} [${email}]`;
            document.getElementById('aiStatus').innerText = "SYSTEM STATUS: LOGGED IN";
        }

        function saveActivity() {
            const act = document.getElementById('activityInput').value;
            if(act) {
                localStorage.setItem('lastActivity', act);
                document.getElementById('aiStatus').innerText = "CORE UPDATED: " + act;
                document.getElementById('activityInput').value = "";
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
